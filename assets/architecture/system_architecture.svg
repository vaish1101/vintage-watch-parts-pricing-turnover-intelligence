<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Vintage Watch Parts Pricing and Turnover Intelligence system architecture</title>
  <desc id="desc">External inventory and marketplace sources enter a private Python and DuckDB analytical pipeline. Records are cleaned, candidates are retrieved and validated, pricing and turnover estimates converge into a governed dashboard contract, and a separate privacy-safe synthetic demo is published to GitHub Pages.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="155%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#17211d" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#78827c"/></marker>
    <style>
      .heading{font:700 38px Arial,sans-serif;fill:#1d2420}.sub{font:400 16px Arial,sans-serif;fill:#66716b}.canvas{fill:#fff;stroke:#d8deda;stroke-width:1.5}.boundary{fill:#fbfcfb;stroke:#9aa6a0;stroke-width:1.4;stroke-dasharray:7 7}.public-lane{fill:#f3f8fb;stroke:#c9dce8;stroke-width:1.5}.stage{font:700 11px Arial,sans-serif;letter-spacing:1.35px;fill:#66716b}.node{fill:#fff;stroke-width:1.5;filter:url(#shadow)}.source{stroke:#929f98}.store{stroke:#7968bd}.etl{stroke:#3b987b}.evidence{stroke:#bf5c72}.model{stroke:#bc8730}.serve{stroke:#3d82aa}.public{stroke:#5795bb}.title{font:700 14px Arial,sans-serif;fill:#202623}.copy{font:400 11.5px Arial,sans-serif;fill:#69736e}.micro{font:700 9.5px Arial,sans-serif;letter-spacing:.65px;fill:#68736d}.icon{font:700 11px Arial,sans-serif;fill:#fff}.flow{fill:none;stroke:#78827c;stroke-width:1.8;marker-end:url(#arrow)}.join{fill:none;stroke:#9ba49f;stroke-width:1.5}.label-bg{fill:#f7f8f6;stroke:#e5e8e6;stroke-width:.7}.label{font:700 9px Arial,sans-serif;letter-spacing:.35px;fill:#657069}.badge{font:700 10px Arial,sans-serif;letter-spacing:.85px}
    </style>
  </defs>
  <rect width="1800" height="900" fill="#f3f1ec"/>
  <text x="54" y="58" class="heading">System architecture</text>
  <text x="54" y="88" class="sub">A traceable flow from external evidence to a governed, client-facing pricing and turnover contract.</text>
  <rect x="40" y="116" width="1720" height="552" rx="17" class="canvas"/>

