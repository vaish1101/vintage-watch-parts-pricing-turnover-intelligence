<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">Vintage Watch Parts Pricing and Turnover Intelligence system architecture</title>
  <desc id="desc">A private operational ETL and analytics pipeline with DuckDB, evidence validation, pricing and turnover engines, plus a separate synthetic static public demo.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#17211d" flood-opacity=".09"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#78827c"/>
    </marker>
    <style>
      .heading{font:700 36px Arial,sans-serif;fill:#1e2421}.sub{font:400 16px Arial,sans-serif;fill:#66716b}.lane{fill:#fff;stroke:#d9dedb;stroke-width:1.5}.public-lane{fill:#f4f8fb;stroke:#cbdce7;stroke-width:1.5}.stage{font:700 11px Arial,sans-serif;letter-spacing:1.4px;fill:#66716b}.node{fill:#fff;stroke-width:1.5;filter:url(#shadow)}.source{stroke:#9aa5a0}.etl{stroke:#3d9a7d}.store{stroke:#7968bd}.evidence{stroke:#c05b72}.model{stroke:#bd8b32}.serve{stroke:#3e83ad}.public{stroke:#5694ba}.title{font:700 15px Arial,sans-serif;fill:#202623}.copy{font:400 12px Arial,sans-serif;fill:#6b746f}.tech{font:700 10px Arial,sans-serif;letter-spacing:.7px}.icon{font:700 12px Arial,sans-serif;fill:#fff}.flow{fill:none;stroke:#78827c;stroke-width:2;marker-end:url(#arrow)}.thin{fill:none;stroke:#a8b0ac;stroke-width:1.5;marker-end:url(#arrow)}.divider{stroke:#d9dedb;stroke-width:1.4;stroke-dasharray:7 8}.badge{font:700 10px Arial,sans-serif;letter-spacing:.8px}.note{font:600 11px Arial,sans-serif;fill:#4b5650}
    </style>
  </defs>

  <rect width="1800" height="900" fill="#f3f1ec"/>
  <text x="60" y="60" class="heading">System architecture</text>
  <text x="60" y="90" class="sub">Sources → ETL and data quality → governed DuckDB layers → evidence intelligence → pricing and turnover → client dashboard</text>

  <rect x="42" y="122" width="1716" height="548" rx="16" class="lane"/>
  <rect x="62" y="142" width="240" height="28" rx="14" fill="#e7f3ed"/>
  <text x="182" y="160" text-anchor="middle" class="badge" fill="#237251">PRIVATE OPERATIONAL PIPELINE</text>

  <text x="76" y="207" class="stage">SOURCES</text>
  <text x="328" y="207" class="stage">EXTRACT + INGEST</text>
  <text x="582" y="207" class="stage">TRANSFORM + STORE</text>
  <text x="858" y="207" class="stage">EVIDENCE INTELLIGENCE</text>
  <text x="1162" y="207" class="stage">ANALYTICS</text>
  <text x="1450" y="207" class="stage">SERVING + OUTPUT</text>

  <rect x="72" y="236" width="205" height="82" rx="9" class="node source"/>
  <rect x="88" y="252" width="32" height="32" rx="7" fill="#65736c"/><text x="104" y="273" text-anchor="middle" class="icon">CSV</text>
  <text x="132" y="264" class="title">Client inventory</text><text x="132" y="286" class="copy">Part identity and stock</text><text x="132" y="303" class="copy">Private source file</text>

  <rect x="72" y="338" width="205" height="82" rx="9" class="node source"/>
  <rect x="88" y="354" width="32" height="32" rx="7" fill="#65736c"/><text x="104" y="375" text-anchor="middle" class="icon">API</text>
  <text x="132" y="366" class="title">Active marketplace</text><text x="132" y="388" class="copy">eBay Browse API</text><text x="132" y="405" class="copy">Current asking prices</text>

  <rect x="72" y="440" width="205" height="82" rx="9" class="node source"/>
  <rect x="88" y="456" width="32" height="32" rx="7" fill="#65736c"/><text x="104" y="477" text-anchor="middle" class="icon">H</text>
  <text x="132" y="468" class="title">Historical sales</text><text x="132" y="490" class="copy">Sold evidence exports</text><text x="132" y="507" class="copy">Price, date and volume</text>

  <path d="M277 277H306V379H330" class="thin"/><path d="M277 379H330" class="thin"/><path d="M277 481H306V379H330" class="thin"/>

  <rect x="330" y="286" width="214" height="92" rx="9" class="node etl"/>
  <rect x="348" y="305" width="34" height="34" rx="8" fill="#258267"/><text x="365" y="327" text-anchor="middle" class="icon">PY</text>
  <text x="394" y="319" class="title">Python ingestion</text><text x="394" y="341" class="copy">Schema checks, hashes, lineage</text><text x="394" y="358" class="copy">Idempotent incremental loads</text>
  <rect x="330" y="405" width="214" height="92" rx="9" class="node etl"/>
  <rect x="348" y="424" width="34" height="34" rx="8" fill="#258267"/><text x="365" y="446" text-anchor="middle" class="icon">DQ</text>
  <text x="394" y="438" class="title">Cleaning + data quality</text><text x="394" y="460" class="copy">Normalize identifiers</text><text x="394" y="477" class="copy">Deduplicate and validate</text>
  <path d="M437 378V405" class="flow"/>

  <path d="M544 451H584" class="flow"/>
  <rect x="584" y="286" width="222" height="211" rx="11" class="node store"/>
  <rect x="604" y="306" width="40" height="40" rx="9" fill="#6d5bb0"/><text x="624" y="331" text-anchor="middle" class="icon">DB</text>
  <text x="658" y="322" class="title">DuckDB analytical store</text>
  <rect x="606" y="364" width="176" height="34" rx="6" fill="#f2effb"/><text x="620" y="385" class="tech" fill="#5d4ca4">RAW LAYER</text><text x="704" y="385" class="copy">preserved evidence</text>
  <rect x="606" y="409" width="176" height="34" rx="6" fill="#f2effb"/><text x="620" y="430" class="tech" fill="#5d4ca4">STAGING</text><text x="689" y="430" class="copy">canonical grain</text>
  <rect x="606" y="454" width="176" height="26" rx="6" fill="#f2effb"/><text x="620" y="472" class="tech" fill="#5d4ca4">CONTRACTS + LINEAGE</text>

  <path d="M806 391H850" class="flow"/>
  <rect x="850" y="266" width="246" height="96" rx="9" class="node evidence"/>
  <rect x="868" y="286" width="34" height="34" rx="8" fill="#ad4c64"/><text x="885" y="308" text-anchor="middle" class="icon">Q</text>
  <text x="914" y="300" class="title">Tiered retrieval</text><text x="914" y="322" class="copy">Exact → controlled relaxation</text><text x="914" y="339" class="copy">Broad recall, no automatic acceptance</text>
  <rect x="850" y="404" width="246" height="110" rx="9" class="node evidence"/>
  <rect x="868" y="425" width="34" height="34" rx="8" fill="#ad4c64"/><text x="885" y="447" text-anchor="middle" class="icon">ID</text>
  <text x="914" y="439" class="title">Matching + evidence gates</text><text x="914" y="461" class="copy">Identity and contradiction checks</text><text x="914" y="478" class="copy">Stable evidence deduplication</text><text x="914" y="495" class="copy">Confidence or rejection</text>
  <path d="M973 362V404" class="flow"/>

  <path d="M1096 459H1142" class="flow"/>
  <rect x="1142" y="286" width="232" height="92" rx="9" class="node model"/>
  <rect x="1160" y="305" width="36" height="36" rx="8" fill="#aa771e"/><text x="1178" y="328" text-anchor="middle" class="icon">TMV</text>
  <text x="1209" y="319" class="title">Pricing intelligence</text><text x="1209" y="341" class="copy">Historical first, active fallback</text><text x="1209" y="358" class="copy">Value, range and confidence</text>
  <rect x="1142" y="418" width="232" height="92" rx="9" class="node model"/>
  <rect x="1160" y="437" width="36" height="36" rx="8" fill="#aa771e"/><text x="1178" y="460" text-anchor="middle" class="icon">T</text>
  <text x="1209" y="451" class="title">Turnover intelligence</text><text x="1209" y="473" class="copy">Evidence hierarchy + hazard</text><text x="1209" y="490" class="copy">Horizon, probability, confidence</text>

  <path d="M1374 332H1415V395H1440" class="thin"/><path d="M1374 464H1415V395H1440" class="thin"/>
  <rect x="1440" y="266" width="270" height="96" rx="9" class="node serve"/>
  <rect x="1458" y="286" width="36" height="36" rx="8" fill="#33799f"/><text x="1476" y="309" text-anchor="middle" class="icon">1R</text>
  <text x="1508" y="300" class="title">Dashboard contract</text><text x="1508" y="322" class="copy">One row per eligible item</text><text x="1508" y="339" class="copy">Price, turnover and traceback</text>
  <path d="M1575 362V405" class="flow"/>
  <rect x="1440" y="405" width="270" height="109" rx="9" class="node serve"/>
  <rect x="1458" y="426" width="36" height="36" rx="8" fill="#33799f"/><text x="1476" y="449" text-anchor="middle" class="icon">WEB</text>
  <text x="1508" y="440" class="title">Client dashboard</text><text x="1508" y="462" class="copy">HTML, CSS, JavaScript + Python API</text><text x="1508" y="479" class="copy">Inventory updates and pipeline jobs</text><text x="1508" y="496" class="copy">Decision support with evidence trace</text>

  <rect x="72" y="552" width="342" height="70" rx="9" fill="#f8faf8" stroke="#d9dedb"/>
  <text x="92" y="579" class="note">Governance boundary</text><text x="92" y="600" class="copy">Credentials, client inventory and raw marketplace evidence stay private.</text>

  <line x1="60" y1="704" x2="1740" y2="704" class="divider"/>
  <rect x="42" y="728" width="1716" height="132" rx="16" class="public-lane"/>
  <rect x="62" y="746" width="216" height="26" rx="13" fill="#e4f0f7"/><text x="170" y="763" text-anchor="middle" class="badge" fill="#2d6f95">PUBLIC SYNTHETIC DEMO</text>
  <rect x="310" y="770" width="230" height="64" rx="8" class="node public"/><text x="330" y="796" class="title">Synthetic inputs</text><text x="330" y="817" class="copy">Fabricated inventory and evidence</text>
  <path d="M540 802H634" class="flow"/>
  <rect x="634" y="770" width="230" height="64" rx="8" class="node etl"/><text x="654" y="796" class="title">Public analytics logic</text><text x="654" y="817" class="copy">Deterministic offline pipeline</text>
  <path d="M864 802H958" class="flow"/>
  <rect x="958" y="770" width="230" height="64" rx="8" class="node model"/><text x="978" y="796" class="title">Frozen JSON contract</text><text x="978" y="817" class="copy">No database or private records</text>
  <path d="M1188 802H1282" class="flow"/>
  <rect x="1282" y="770" width="250" height="64" rx="8" class="node public"/><text x="1302" y="796" class="title">Static portfolio dashboard</text><text x="1302" y="817" class="copy">JavaScript + Chart.js on GitHub Pages</text>
  <rect x="1570" y="783" width="150" height="36" rx="18" fill="#e7f3ed"/><text x="1645" y="805" text-anchor="middle" class="badge" fill="#237251">PRIVACY SAFE</text>
</svg>
