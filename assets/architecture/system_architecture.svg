  <rect x="68" y="312" width="202" height="82" rx="9" class="node source"/><rect x="84" y="328" width="32" height="32" rx="7" fill="#65736c"/><text x="100" y="349" text-anchor="middle" class="icon">API</text><text x="128" y="340" class="title">Active marketplace</text><text x="128" y="362" class="copy">eBay Browse API</text><text x="128" y="379" class="copy">Current asking evidence</text>
  <rect x="68" y="426" width="202" height="82" rx="9" class="node source"/><rect x="84" y="442" width="32" height="32" rx="7" fill="#65736c"/><text x="100" y="463" text-anchor="middle" class="icon">H</text><text x="128" y="454" class="title">Historical sales</text><text x="128" y="476" class="copy">eBay Sold + VCP</text><text x="128" y="493" class="copy">Realized sale evidence</text>

