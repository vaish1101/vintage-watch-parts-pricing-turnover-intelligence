<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="470" viewBox="0 0 1500 470" role="img" aria-labelledby="title desc">
  <title id="title">Turnover evidence hierarchy</title>
  <desc id="desc">A transparent fallback ladder from direct item evidence to cohort evidence, portfolio prior or insufficient sold evidence.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17211d" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#78827c"/></marker>
    <style>
      .h{font:700 30px Arial,sans-serif;fill:#1e2421}.s{font:400 15px Arial,sans-serif;fill:#68736d}.card{fill:#fff;stroke-width:1.5;filter:url(#shadow)}.direct{stroke:#2d8a62}.cohort{stroke:#3e83ad}.prior{stroke:#bd8b32}.none{stroke:#b9b9b4}.t{font:700 15px Arial,sans-serif;fill:#202623}.c{font:400 12px Arial,sans-serif;fill:#6b746f}.a{fill:none;stroke:#78827c;stroke-width:2;marker-end:url(#arrow)}.rank{font:700 13px Arial,sans-serif;fill:#fff}.badge{font:700 10px Arial,sans-serif;letter-spacing:.7px}.result{font:700 12px Arial,sans-serif;fill:#44504a}
    </style>
  </defs>
  <rect width="1500" height="470" fill="#f3f1ec"/>
  <text x="54" y="54" class="h">Turnover evidence hierarchy</text>
  <text x="54" y="82" class="s">The engine uses the strongest available sold evidence and lowers confidence as it falls back.</text>

  <rect x="52" y="132" width="300" height="170" rx="11" class="card direct"/>
  <circle cx="84" cy="165" r="17" fill="#287554"/><text x="84" y="170" text-anchor="middle" class="rank">1</text>
  <text x="112" y="170" class="t">Direct item hazard</text><text x="74" y="208" class="c">Accepted sold observations</text><text x="74" y="229" class="c">for the same inventory identity</text>
  <rect x="74" y="258" width="92" height="24" rx="12" fill="#e5f3ec"/><text x="120" y="274" text-anchor="middle" class="badge" fill="#287554">HIGH SUPPORT</text>

  <path d="M352 217H394" class="a"/>
  <rect x="394" y="132" width="300" height="170" rx="11" class="card cohort"/>
  <circle cx="426" cy="165" r="17" fill="#33799f"/><text x="426" y="170" text-anchor="middle" class="rank">2</text>
  <text x="454" y="170" class="t">Comparable cohort</text><text x="416" y="208" class="c">Brand and caliber peer velocity</text><text x="416" y="229" class="c">when direct history is absent</text>
  <rect x="416" y="258" width="118" height="24" rx="12" fill="#e4f0f7"/><text x="475" y="274" text-anchor="middle" class="badge" fill="#2d6f95">MEDIUM SUPPORT</text>

  <path d="M694 217H736" class="a"/>
  <rect x="736" y="132" width="300" height="170" rx="11" class="card prior"/>
  <circle cx="768" cy="165" r="17" fill="#aa771e"/><text x="768" y="170" text-anchor="middle" class="rank">3</text>
  <text x="796" y="170" class="t">Portfolio prior</text><text x="758" y="208" class="c">Broader brand or portfolio rate</text><text x="758" y="229" class="c">when peer evidence is sparse</text>
  <rect x="758" y="258" width="104" height="24" rx="12" fill="#f8efdc"/><text x="810" y="274" text-anchor="middle" class="badge" fill="#956716">LOW SUPPORT</text>

  <path d="M1036 217H1078" class="a"/>
  <rect x="1078" y="132" width="360" height="170" rx="11" class="card none"/>
  <circle cx="1110" cy="165" r="17" fill="#8c918e"/><text x="1110" y="170" text-anchor="middle" class="rank">4</text>
  <text x="1138" y="170" class="t">Insufficient sold evidence</text><text x="1100" y="208" class="c">No defensible velocity estimate</text><text x="1100" y="229" class="c">No precise selling horizon displayed</text>
  <rect x="1100" y="258" width="172" height="24" rx="12" fill="#ececea"/><text x="1186" y="274" text-anchor="middle" class="badge" fill="#6d7470">EXPLICITLY UNAVAILABLE</text>

  <rect x="200" y="350" width="1100" height="68" rx="10" fill="#fff" stroke="#d8ddd9"/>
  <text x="224" y="379" class="result">Every supported level produces:</text><text x="430" y="379" class="c">median selling horizon</text><circle cx="584" cy="375" r="3" fill="#78827c"/><text x="600" y="379" class="c">30 and 90 day probabilities</text><circle cx="785" cy="375" r="3" fill="#78827c"/><text x="801" y="379" class="c">method</text><circle cx="861" cy="375" r="3" fill="#78827c"/><text x="877" y="379" class="c">confidence</text>
  <text x="224" y="400" class="c">Directional constant hazard approximation, never a guaranteed sale date.</text>
</svg>
