name: Public release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Rebuild deterministic demo
        run: |
          cp dashboard/demo-data.json /tmp/demo-data.before.json
          cp data/sample/synthetic_inventory.csv /tmp/inventory.before.csv
          python scripts/run_sample_pipeline.py
          cmp /tmp/demo-data.before.json dashboard/demo-data.json
          cmp /tmp/inventory.before.csv data/sample/synthetic_inventory.csv
      - run: python -m json.tool dashboard/demo-data.json > /dev/null
      - run: python -m compileall -q src scripts tests
      - run: python scripts/validate_public_release.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
